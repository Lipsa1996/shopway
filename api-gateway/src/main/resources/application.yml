  spring:
    application:
      name: api-gateway

    cloud:
      gateway:
        server:
          webmvc:

            routes:

              - id: auth-service
                uri: http://localhost:8086
                predicates:
                  - Path=/api/auth/**

              - id: catalog-service
                uri: http://localhost:8087
                predicates:
                  - Path=/api/catalog/**

              - id: cart-service
                uri: http://localhost:8088
                predicates:
                  - Path=/api/cart/**

              - id: order-service
                uri: http://localhost:8089
                predicates:
                  - Path=/api/orders/**

              - id: notification-service
                uri: http://localhost:8090
                predicates:
                  - Path=/api/notification/**

            globalcors:
              cors-configurations:
                '[/**]':
                  allowedOrigins:
                    - "http://localhost:4200"
                  allowedMethods:
                    - GET
                    - POST
                    - PUT
                    - DELETE
                    - PATCH
                    - OPTIONS
                  allowedHeaders:
                    - "*"
                  allowCredentials: true

              add-to-simple-url-handler-mapping: true

  server:
    port: 8085

  management:
    endpoints:
      web:
        exposure:
          include: "*"

  jwt:
    secret: ${JWT_SECRET}
    expiration: 900000


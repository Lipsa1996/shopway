spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webmvc:

          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "http://localhost:4200"

                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - PATCH
                  - OPTIONS

                allowedHeaders:
                  - "*"

                allowCredentials: true

            add-to-simple-url-handler-mapping: true

server:
  port: 8085

management:
  endpoints:
    web:
      exposure:
        include: "*"

jwt:
  secret: ${JWT_SECRET}
  expiration: 900000